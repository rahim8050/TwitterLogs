name: Django CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_TIME: ${{ github.event.head_commit.timestamp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit
          pre-commit install-hooks

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run Django checks and tests
        env:
          DJANGO_SETTINGS_MODULE: TwitterUnfollow.settings
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python manage.py check
          python manage.py test --noinput

      - name: Collect build metadata
        id: meta
        shell: bash
        run: |
          echo "author=$(git log -1 --pretty=format:'%an <%ae>')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT
          echo "end_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          # universal duration calculation for GNU/BSD date
          start=$(date -u -d "${{ env.START_TIME }}" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "${{ env.START_TIME }}" +%s)
          now=$(date -u +%s)
          echo "duration=$((now - start)) seconds" >> $GITHUB_OUTPUT

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: "${{ secrets.EMAIL_FROM }}"
          to: "${{ secrets.EMAIL_TO }}"
          secure: false
          subject: "✅ CI Passed: TwitterUnfollow Build Successful"
          body: |
            ✅ **Build Summary**

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref_name }}
            **Commit SHA:** ${{ github.sha }}
            **Commit Message:** ${{ steps.meta.outputs.message }}
            **Commit Author:** ${{ steps.meta.outputs.author }}

            **Workflow:** ${{ github.workflow }}
            **Job:** ${{ github.job }}
            **Run ID:** ${{ github.run_id }}

            **Start Time:** ${{ env.START_TIME }}
            **End Time:** ${{ steps.meta.outputs.end_time }}
            **Duration:** ${{ steps.meta.outputs.duration }}

            🧪 All pre-commit checks and Django tests have passed successfully.

            --
            CI Bot 🤖 (GitHub Actions)
            TwitterUnfollow Project
