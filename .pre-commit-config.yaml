repos:
  # --- Code Formatter ---
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: Black Formatter
        language_version: python
        args: ["--line-length", "88"]

  # --- Linter / Static Analysis ---
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.6.5
    hooks:
      - id: ruff
        name: Ruff Linter
        args: ["--fix", "--exit-non-zero-on-fix"]
        language_version: python

  # --- Security Scanner ---
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        name: Bandit Security Scanner
        args:
          - "-c"
          - "pyproject.toml"
          - "-r"
          - "."
          - "--exclude"
          - "./venv,./.venv,./env,./.env,./migrations,./tests"
        pass_filenames: false
        language_version: python

  # --- Type Checker for Django ---
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.1
    hooks:
      - id: mypy
        name: mypy (Django)
        additional_dependencies:
          - django>=5.0
          - django-stubs>=5.2.0
          - types-PyYAML
          - python-dotenv
        args:
          - "--config-file=mypy.ini"
          - "TwitterUnfollow"
          - "twitterlogs"
          - "manage.py"
        pass_filenames: false
        language_version: python
        env:
          PYTHONPATH: "C:\\Users\\rahim\\django_projects\\TwitterUnfollow"
